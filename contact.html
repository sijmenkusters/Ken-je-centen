    <div class="contact">
        <h2>Contact</h2>
        <br>
        <p>Heb je een vraag? Vul het formulier in en neem contact met ons op!</p>

        <form action="#" method="POST">
            <label for="naam">Naam</label>
            <input type="text" id="naam" name="naam"
                placeholder="Je naam" required>

            <label for="email">E-mailadres</label>
            <input type="email" id="email" name="email"
                placeholder="jouw@email.nl" required>

            <label for="onderwerp">Onderwerp</label>
            <input type="text" id="onderwerp" name="onderwerp"
                placeholder="Waar gaat je vraag over?" required>

            <label for="bericht">Bericht</label>
            <textarea id="bericht" name="bericht" rows="5"
                    placeholder="Typ hier je vraag..." required></textarea>

            <button type="submit">Verstuur bericht</button>
        </form>
    </div>
